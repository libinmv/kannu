name: Recover Environment

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Create .env
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          {
            printf 'APPLE_CERTIFICATE=%s\n' "$APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$APPLE_CERTIFICATE_PASSWORD"
            printf 'APPLE_ID=%s\n' "$APPLE_ID"
            printf 'APPLE_NOTARIZATION_PASSWORD=%s\n' "$APPLE_NOTARIZATION_PASSWORD"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID"
            printf 'KEYCHAIN_PASSWORD=%s\n' "$KEYCHAIN_PASSWORD"
            printf 'SPARKLE_EDDSA_PRIVATE_KEY=%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY"
          } > env

      - name: Upload recovered .env
        uses: actions/upload-artifact@v4
        with:
          name: recovered-env
          path: env
          retention-days: 1